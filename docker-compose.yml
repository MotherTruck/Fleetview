services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - fleetview-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  server:
    image: ghcr.io/mothertruck/fleetview-server:${FLEETVIEW_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      # Optional legacy shared token. Leave unset to accept only one-time per-device tokens.
      ENROLLMENT_TOKEN: ${ENROLLMENT_TOKEN:-}
      METRICS_RETENTION_DAYS: "7"
      # How long (seconds) a job may sit "running" with no completion
      # report before it's recovered as outcome_unknown -- see
      # devices.rs's reap_stale_jobs. 1800s (30 min) comfortably covers
      # every built-in job type; raise it if you deploy custom scripts
      # that legitimately run longer than that.
      FLEETVIEW_JOB_LEASE_SECONDS: ${FLEETVIEW_JOB_LEASE_SECONDS:-1800}
      FLEETVIEW_COOKIE_SECURE: ${FLEETVIEW_COOKIE_SECURE:-false}
      # Required only if you configure a Proxmox/OPNsense integration (docs/INTEGRATIONS.md).
      FLEETVIEW_SECRET_KEY: ${FLEETVIEW_SECRET_KEY:-}
      # Who X-Forwarded-For is trusted from for login-throttle-by-source-IP
      # keying (see accounts.rs's client_ip): the loopback address a
      # locally-run reverse proxy would connect from, plus the caddy
      # service's static IP below so this still works correctly when the
      # tls profile is enabled (otherwise every request would appear to
      # come from caddy's own IP once it's proxying). Harmless when caddy
      # isn't running: that address is simply unused, and it's only
      # reachable from other containers on the internal frontend network,
      # never from outside.
      FORWARDED_ALLOW_IPS: "127.0.0.1,172.28.0.10"
    ports:
      # This is the plain-HTTP port. Widening FLEETVIEW_BIND_ADDRESS
      # beyond loopback publishes it to the LAN unencrypted -- fine only
      # for a LAN you fully trust (see the README); the recommended path
      # for reaching this from elsewhere is the tls profile below, which
      # uses its own separate FLEETVIEW_TLS_BIND_ADDRESS so turning TLS on
      # never also widens this plaintext port.
      - "${FLEETVIEW_BIND_ADDRESS:-127.0.0.1}:${FLEETVIEW_PORT:-8080}:8080"
    # Uses the image's own HEALTHCHECK (server/Dockerfile) rather than
    # redeclaring it here.
    networks:
      - frontend
      - backend

  # Optional TLS termination for agent<->server traffic, encrypting it in
  # transit. Off by default; enable with `docker compose --profile tls up -d`
  # (or COMPOSE_PROFILES=tls in .env) after setting FLEETVIEW_TLS_HOSTNAME.
  # Caddy mints its own private CA and a leaf certificate for that
  # hostname/IP on first start (see docs/TLS.md) rather than using a public
  # CA like Let's Encrypt, since this is normally reached by a LAN IP or
  # private hostname, which public CAs won't issue certificates for at all.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["tls"]
    depends_on:
      - server
    environment:
      # Not ${FLEETVIEW_TLS_HOSTNAME:?...} (a hard requirement): Compose
      # validates every service's required variables while parsing the
      # whole file, before it knows which profiles are even active -- so a
      # required var here broke `docker compose pull`/`up` for EVERY
      # deployment, including ones that never touch --profile tls at all,
      # until FLEETVIEW_TLS_HOSTNAME was set to something. Caddy itself
      # (entrypoint below) is what actually enforces this, and only when
      # the tls profile -- and so this container -- is running.
      FLEETVIEW_TLS_HOSTNAME: ${FLEETVIEW_TLS_HOSTNAME:-}
    entrypoint: >
      sh -c '
      if [ -z "$$FLEETVIEW_TLS_HOSTNAME" ]; then
        echo "FLEETVIEW_TLS_HOSTNAME is not set -- set it in .env to the LAN IP or hostname agents and browsers will connect to, then restart (see docs/TLS.md)." >&2;
        exit 1;
      fi;
      exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
      '
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - fleetview-caddy-data:/data
      - fleetview-caddy-config:/config
    ports:
      # Deliberately its own variable, not FLEETVIEW_BIND_ADDRESS (which
      # controls the plain-HTTP server's port below): sharing one meant
      # widening FLEETVIEW_BIND_ADDRESS to reach Caddy from the LAN also
      # widened the plaintext :8080 port to the LAN in the same step,
      # defeating the point of turning TLS on. Defaults to 0.0.0.0 since
      # enabling this profile is itself the deliberate choice to expose
      # the dashboard beyond this machine -- encrypted, via Caddy only.
      - "${FLEETVIEW_TLS_BIND_ADDRESS:-0.0.0.0}:${FLEETVIEW_TLS_PORT:-8443}:8443"
    networks:
      frontend:
        ipv4_address: 172.28.0.10

volumes:
  fleetview-postgres:
  fleetview-caddy-data:
  fleetview-caddy-config:

networks:
  frontend:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  backend:
    internal: true
