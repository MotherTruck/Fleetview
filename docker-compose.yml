services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - fleetview-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  server:
    image: ghcr.io/mothertruck/fleetview-server:${FLEETVIEW_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      # Optional legacy shared token. Leave unset to accept only one-time per-device tokens.
      ENROLLMENT_TOKEN: ${ENROLLMENT_TOKEN:-}
      TRUSTED_PROXY_COUNT: "0"
      METRICS_RETENTION_DAYS: "7"
      FLEETVIEW_COOKIE_SECURE: ${FLEETVIEW_COOKIE_SECURE:-false}
    # --forwarded-allow-ips always includes the caddy service's static IP
    # below so login-throttle-by-source-IP still works correctly when the
    # tls profile is enabled (otherwise every request would appear to come
    # from caddy's own IP once it's proxying). Harmless when caddy isn't
    # running: that address is simply unused, and it's only reachable from
    # other containers on the internal frontend network, never from outside.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--proxy-headers", "--forwarded-allow-ips", "127.0.0.1,172.28.0.10"]
    ports:
      - "${FLEETVIEW_BIND_ADDRESS:-${EPC_BIND_ADDRESS:-127.0.0.1}}:${FLEETVIEW_PORT:-${EPC_PORT:-8080}}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - frontend
      - backend

  # Optional TLS termination for agent<->server traffic, encrypting it in
  # transit. Off by default; enable with `docker compose --profile tls up -d`
  # (or COMPOSE_PROFILES=tls in .env) after setting FLEETVIEW_TLS_HOSTNAME.
  # Caddy mints its own private CA and a leaf certificate for that
  # hostname/IP on first start (see docs/TLS.md) rather than using a public
  # CA like Let's Encrypt, since this is normally reached by a LAN IP or
  # private hostname, which public CAs won't issue certificates for at all.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["tls"]
    depends_on:
      - server
    environment:
      FLEETVIEW_TLS_HOSTNAME: ${FLEETVIEW_TLS_HOSTNAME:?Set FLEETVIEW_TLS_HOSTNAME in .env to use the tls profile — the LAN IP or hostname agents and browsers will connect to}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - fleetview-caddy-data:/data
      - fleetview-caddy-config:/config
    ports:
      - "${FLEETVIEW_BIND_ADDRESS:-127.0.0.1}:${FLEETVIEW_TLS_PORT:-8443}:8443"
    networks:
      frontend:
        ipv4_address: 172.28.0.10

volumes:
  fleetview-postgres:
  fleetview-caddy-data:
  fleetview-caddy-config:

networks:
  frontend:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  backend:
    internal: true
