# ============================================================================
# EDIT ME: before starting FleetView for the first time, replace
# POSTGRES_PASSWORD and ADMIN_TOKEN just below with your own random
# values -- generate each with:
#   openssl rand -hex 32
# (run it twice; use a different value for each). The server refuses to
# start if either is left at its placeholder. Everything else in this
# file has a working default (the dashboard's port, further down under
# the server service, is one you may want to look at too -- see
# "Reaching it from other devices" in README.md).
# ============================================================================
x-db-credentials: &db_credentials
  # Shared via YAML anchor (not Compose variable interpolation) so the db
  # and server services can never disagree -- editing POSTGRES_PASSWORD
  # here updates both at once.
  POSTGRES_DB: fleetview
  POSTGRES_USER: fleetview
  POSTGRES_PASSWORD: REPLACE_WITH_output_of_openssl_rand_hex_32

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      <<: *db_credentials
    volumes:
      - fleetview-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  server:
    image: ghcr.io/mothertruck/fleetview-server:${FLEETVIEW_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db_credentials
      ADMIN_TOKEN: REPLACE_WITH_a_different_output_of_openssl_rand_hex_32
      # Optional legacy shared token. Leave unset to accept only one-time per-device tokens.
      ENROLLMENT_TOKEN: ${ENROLLMENT_TOKEN:-}
      METRICS_RETENTION_DAYS: "7"
      # How long (seconds) a job may sit "running" with no completion
      # report before it's recovered as outcome_unknown -- see
      # devices.rs's reap_stale_jobs. 1800s (30 min) comfortably covers
      # every built-in job type; raise it if you deploy custom scripts
      # that legitimately run longer than that.
      FLEETVIEW_JOB_LEASE_SECONDS: ${FLEETVIEW_JOB_LEASE_SECONDS:-1800}
      FLEETVIEW_COOKIE_SECURE: ${FLEETVIEW_COOKIE_SECURE:-false}
      # Required only if you configure a Proxmox/OPNsense integration (docs/INTEGRATIONS.md).
      FLEETVIEW_SECRET_KEY: ${FLEETVIEW_SECRET_KEY:-}
      # Who X-Forwarded-For is trusted from for login-throttle-by-source-IP
      # keying (see accounts.rs's client_ip): the loopback address a
      # locally-run reverse proxy would connect from, plus the caddy
      # service's static IP below so this still works correctly when the
      # tls profile is enabled (otherwise every request would appear to
      # come from caddy's own IP once it's proxying). Harmless when caddy
      # isn't running: that address is simply unused, and it's only
      # reachable from other containers on the internal frontend network,
      # never from outside.
      FORWARDED_ALLOW_IPS: "127.0.0.1,172.28.0.10"
    entrypoint: >
      sh -c '
      case "$$POSTGRES_PASSWORD$$ADMIN_TOKEN" in
        *REPLACE_WITH_*)
          echo "POSTGRES_PASSWORD and/or ADMIN_TOKEN in docker-compose.yml are still the placeholder values -- replace both with the output of openssl rand -hex 32 (a different value for each), then restart." >&2;
          exit 1
          ;;
      esac;
      export DATABASE_URL="postgres://$$POSTGRES_USER:$$POSTGRES_PASSWORD@db:5432/$$POSTGRES_DB";
      exec ./fleetview-server
      '
    ports:
      # No address given means every network interface this machine has
      # (a normal Docker published port), so this is reachable from other
      # devices on your network out of the box. This is plain HTTP, not
      # encrypted -- fine on a LAN you trust (see the README); for
      # encryption instead, see the tls profile below, which uses its own
      # separate FLEETVIEW_TLS_BIND_ADDRESS so turning TLS on never also
      # widens this plaintext port. To restrict this one instead, change
      # it to "127.0.0.1:8080:8080" (only this machine) or
      # "<LAN IP>:8080:8080" (just that one interface).
      - "8080:8080"
    # Uses the image's own HEALTHCHECK (server/Dockerfile) rather than
    # redeclaring it here.
    networks:
      - frontend
      - backend

  # Optional TLS termination for agent<->server traffic, encrypting it in
  # transit. Off by default; enable with `docker compose --profile tls up -d`
  # (or COMPOSE_PROFILES=tls in .env) after setting FLEETVIEW_TLS_HOSTNAME.
  # Caddy mints its own private CA and a leaf certificate for that
  # hostname/IP on first start (see docs/TLS.md) rather than using a public
  # CA like Let's Encrypt, since this is normally reached by a LAN IP or
  # private hostname, which public CAs won't issue certificates for at all.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["tls"]
    depends_on:
      - server
    environment:
      # Not ${FLEETVIEW_TLS_HOSTNAME:?...} (a hard requirement): Compose
      # validates every service's required variables while parsing the
      # whole file, before it knows which profiles are even active -- so a
      # required var here broke `docker compose pull`/`up` for EVERY
      # deployment, including ones that never touch --profile tls at all,
      # until FLEETVIEW_TLS_HOSTNAME was set to something. Caddy itself
      # (entrypoint below) is what actually enforces this, and only when
      # the tls profile -- and so this container -- is running.
      FLEETVIEW_TLS_HOSTNAME: ${FLEETVIEW_TLS_HOSTNAME:-}
    entrypoint: >
      sh -c '
      if [ -z "$$FLEETVIEW_TLS_HOSTNAME" ]; then
        echo "FLEETVIEW_TLS_HOSTNAME is not set -- set it in docker-compose.yml (or .env) to the LAN IP or hostname agents and browsers will connect to, then restart (see docs/TLS.md)." >&2;
        exit 1;
      fi;
      exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
      '
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - fleetview-caddy-data:/data
      - fleetview-caddy-config:/config
    ports:
      # Deliberately its own variable, not the server's plain-HTTP port
      # above: so if you restrict that one back to 127.0.0.1 (e.g. because
      # you only want the dashboard reachable over TLS), Caddy's port
      # isn't restricted along with it. Defaults to 0.0.0.0 since enabling
      # this profile is itself the deliberate choice to expose the
      # dashboard beyond this machine -- encrypted, via Caddy only.
      - "${FLEETVIEW_TLS_BIND_ADDRESS:-0.0.0.0}:${FLEETVIEW_TLS_PORT:-8443}:8443"
    networks:
      frontend:
        ipv4_address: 172.28.0.10

volumes:
  fleetview-postgres:
  fleetview-caddy-data:
  fleetview-caddy-config:

networks:
  frontend:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  backend:
    internal: true
