services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - fleetview-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  server:
    image: ghcr.io/mothertruck/fleetview-server:${FLEETVIEW_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      # Optional legacy shared token. Leave unset to accept only one-time per-device tokens.
      ENROLLMENT_TOKEN: ${ENROLLMENT_TOKEN:-}
      METRICS_RETENTION_DAYS: "7"
      # How long (seconds) a job may sit "running" with no completion
      # report before it's recovered as outcome_unknown -- see
      # devices.rs's reap_stale_jobs. 1800s (30 min) comfortably covers
      # every built-in job type; raise it if you deploy custom scripts
      # that legitimately run longer than that.
      FLEETVIEW_JOB_LEASE_SECONDS: ${FLEETVIEW_JOB_LEASE_SECONDS:-1800}
      FLEETVIEW_COOKIE_SECURE: ${FLEETVIEW_COOKIE_SECURE:-false}
      # Required only if you configure a Proxmox/OPNsense integration (docs/INTEGRATIONS.md).
      FLEETVIEW_SECRET_KEY: ${FLEETVIEW_SECRET_KEY:-}
      # Who X-Forwarded-For is trusted from for login-throttle-by-source-IP
      # keying (see accounts.rs's client_ip): the loopback address a
      # locally-run reverse proxy would connect from, plus the caddy
      # service's static IP below so this still works correctly when the
      # tls profile is enabled (otherwise every request would appear to
      # come from caddy's own IP once it's proxying). Harmless when caddy
      # isn't running: that address is simply unused, and it's only
      # reachable from other containers on the internal frontend network,
      # never from outside.
      FORWARDED_ALLOW_IPS: "127.0.0.1,172.28.0.10"
    ports:
      - "${FLEETVIEW_BIND_ADDRESS:-127.0.0.1}:${FLEETVIEW_PORT:-8080}:8080"
    # Uses the image's own HEALTHCHECK (server/Dockerfile) rather than
    # redeclaring it here.
    networks:
      - frontend
      - backend

  # Optional TLS termination for agent<->server traffic, encrypting it in
  # transit. Off by default; enable with `docker compose --profile tls up -d`
  # (or COMPOSE_PROFILES=tls in .env) after setting FLEETVIEW_TLS_HOSTNAME.
  # Caddy mints its own private CA and a leaf certificate for that
  # hostname/IP on first start (see docs/TLS.md) rather than using a public
  # CA like Let's Encrypt, since this is normally reached by a LAN IP or
  # private hostname, which public CAs won't issue certificates for at all.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["tls"]
    depends_on:
      - server
    environment:
      FLEETVIEW_TLS_HOSTNAME: ${FLEETVIEW_TLS_HOSTNAME:?Set FLEETVIEW_TLS_HOSTNAME in .env to use the tls profile — the LAN IP or hostname agents and browsers will connect to}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - fleetview-caddy-data:/data
      - fleetview-caddy-config:/config
    ports:
      - "${FLEETVIEW_BIND_ADDRESS:-127.0.0.1}:${FLEETVIEW_TLS_PORT:-8443}:8443"
    networks:
      frontend:
        ipv4_address: 172.28.0.10

volumes:
  fleetview-postgres:
  fleetview-caddy-data:
  fleetview-caddy-config:

networks:
  frontend:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  backend:
    internal: true
