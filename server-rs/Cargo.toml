[package]
name = "fleetview-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fleetview-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws", "macros", "multipart"] }
axum-extra = { version = "0.9", features = ["cookie"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process"] }
futures-util = "0.3"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
rand = "0.8"
base64 = "0.22"
time = "0.3"
subtle = "2"
hex = "0.4"
anyhow = "1"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "multipart"] }
rpassword = "7"
rcgen = { version = "0.14.10", features = ["crypto", "pem", "ring", "x509-parser"], default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
